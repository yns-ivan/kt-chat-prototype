version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ktchat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ktchat
      POSTGRES_USER: ktchat
      POSTGRES_PASSWORD: password
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ktchat-network

  # Go Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ktchat-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgres://ktchat:password@postgres:5432/ktchat?sslmode=disable
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - AWS_REGION=ap-northeast-1
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:-}
      - COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:-}
      - COGNITO_CLIENT_SECRET=${COGNITO_CLIENT_SECRET:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - UPLOAD_PATH=./uploads
      - MAX_FILE_SIZE=52428800
      - ENCRYPTION_KEY=dev-encryption-key-32-bytes-long
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/root/uploads
    depends_on:
      - postgres
    networks:
      - ktchat-network

  # Frontend (Nuxt.js) - Placeholder for future development
  frontend:
    image: node:18-alpine
    container_name: ktchat-frontend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "echo 'Frontend not yet implemented' && tail -f /dev/null"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    networks:
      - ktchat-network

  # Laravel (for master/settings) - Placeholder for future development
  laravel:
    image: php:8.2-apache
    container_name: ktchat-laravel
    restart: unless-stopped
    working_dir: /var/www/html
    command: sh -c "echo 'Laravel not yet implemented' && tail -f /dev/null"
    ports:
      - "8000:80"
    volumes:
      - ./laravel:/var/www/html
    networks:
      - ktchat-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ktchat-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
      - laravel
    networks:
      - ktchat-network

volumes:
  postgres_data:

networks:
  ktchat-network:
    driver: bridge 